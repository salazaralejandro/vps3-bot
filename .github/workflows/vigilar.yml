name: Vigilar VPS-3

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      test:
        description: "Enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar stock
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OS: linux
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python vps3_bot.py --test; fi
          python vps3_bot.py --once

      - name: Guardar estado
        run: |
          git config user.name "vps3-bot"
          git config user.email "vps3-bot@users.noreply.github.com"
          if ! git diff --quiet -- .vps3_state.json; then
            git add .vps3_state.json
            git commit -m "estado: $(cat .vps3_state.json)"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((45*86400)) ]; then
            # GitHub desactiva las tareas programadas tras 60 días sin actividad
            git commit --allow-empty -m "keepalive"
            git push
          fi
